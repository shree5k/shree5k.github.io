<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shreeram K / Work</title>
    <link rel="icon" type="image/png" href="/assets/logo.png">
    <link rel="apple-touch-icon" href="/assets/logo.png">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/work/styles.css">
</head>
<body>
    <main id="main-container">
        <aside class="home-link-aside">
            <a href="/" class="home-link" aria-label="Return home">
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M5.5 4L1.5 8M1.5 8L5.5 12M1.5 8H10C11.3807 8 12.5 6.88071 12.5 5.5V5.5C12.5 4.11929 11.3807 3 10 3H8.5" stroke="currentColor"></path></svg>
                Home
            </a>
        </aside>

        <section class="work-experiment" aria-labelledby="section-title">
            <header class="intro-content work-experiment-intro">
                <h1 id="section-title">Work <span>//</span> Thoughts</h1>
            </header>
            <div id="work-cards-container" class="work-cards" aria-live="polite">
                <p class="work-article-error">Loading work…</p>
            </div>
        </section>
    </main>
    <div class="bottom-fade" aria-hidden="true"></div>

    <script type="module">
        import { fetchArticlesMetadata, getArticleUrl } from '/module-scripts/workArticleMetadata.js';

        const container = document.getElementById('work-cards-container');

        function renderWorkCards(articles) {
            if (!container) return;

            container.replaceChildren();
            articles.forEach((article) => {
                const card = document.createElement('a');
                card.className = article.layout === 'half'
                    ? 'work-card work-card--half'
                    : 'work-card work-card--full';
                card.href = article.link || getArticleUrl(article.slug, 'work');
                if (article.openInNewTab) {
                    card.target = '_blank';
                    card.rel = 'noopener noreferrer';
                }
                card.setAttribute(
                    'aria-label',
                    `${article.link ? 'Open' : 'Read'} ${article.listTitle || article.title}`
                );

                const imageFrame = document.createElement('div');
                imageFrame.className = 'work-card-image-frame';

                const isVideoThumbnail = /\.(mp4|webm|ogg)(?:[?#].*)?$/i.test(article.thumbnail || '');
                const media = document.createElement(isVideoThumbnail ? 'video' : 'img');
                media.className = 'work-card-image';

                if (isVideoThumbnail) {
                    media.src = article.thumbnail;
                    media.autoplay = true;
                    media.loop = true;
                    media.muted = true;
                    media.playsInline = true;
                    media.setAttribute('aria-hidden', 'true');
                } else {
                    media.src = article.thumbnail;
                    media.alt = '';
                    media.loading = 'lazy';
                    media.decoding = 'async';
                }

                imageFrame.appendChild(media);

                const details = document.createElement('div');
                details.className = 'work-card-details';

                const title = document.createElement('h2');
                title.className = 'work-card-title';
                title.textContent = article.listTitle || article.title;

                const date = document.createElement('p');
                date.className = 'work-card-date';
                date.textContent = article.cardDateLabel;

                details.append(title, date);
                card.append(imageFrame, details);
                container.appendChild(card);
            });
        }

        try {
            renderWorkCards(await fetchArticlesMetadata());
        } catch (error) {
            console.error('Failed to load work articles', error);
            if (container) {
                container.innerHTML = '<p class="work-article-error">Something went wrong loading the articles.</p>';
            }
        }
    </script>
</body>
</html>
