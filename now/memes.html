<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>memes</title>

    <style>
        body {
            transition: opacity ease-in 0.2s;
            margin: 0;
            padding: 40px 20px;
            font-family: sans-serif;
            background-color: #ffffff;
            color: #111;
        }

        /* 🥠 Fortune Cookie Link */
        #fortune-trigger {
            position: fixed;
            top: 20px;
            right: 20px;
            font-style: italic;
            font-size: 14px;
            cursor: pointer;
            z-index: 100;
            color: #666;
            user-select: none;
            transition: color 0.2s;
        }
        #fortune-trigger:hover {
            color: #000;
        }

        /* 🖼️ Full Scale Overlay */
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.98); /* Near white, or use rgba(0,0,0,0.9) for dark */
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            cursor: zoom-out;
        }

        #overlay img {
            max-width: 95%;
            max-height: 95%;
            object-fit: contain;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
        }

        #main {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        #main p {
            margin: 0;
            line-height: 1.6;
        }

        .slang-container {
            width: 100%;
            margin: 0 auto;
        }

        .slang-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            width: 100%;
        }

        .slang-column {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .img-wrapper {
            position: relative;
            width: 100%;
            cursor: pointer;
        }

        .slang-item {
            width: 100%;
            height: auto;
            display: block;
        }

        .copy-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 8px 16px;
            font-size: 14px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .copy-overlay.show {
            opacity: 1;
        }

        @media (max-width: 1200px) {
            .slang-grid { grid-template-columns: repeat(4, 1fr); }
        }

        @media (max-width: 768px) {
            .slang-grid { grid-template-columns: repeat(2, 1fr); }
            body { padding: 20px 16px; }
            #fortune-trigger { top: 10px; right: 10px; }
        }
    </style>
</head>

<body>
    <!-- Fortune Cookie Trigger -->
    <div id="fortune-trigger">fortune cookie</div>

    <!-- Full Scale Modal -->
    <div id="overlay">
        <img id="overlay-img" src="" alt="Full Scale View">
    </div>

    <div id="main">
        <p style="margin-bottom: 32px; text-align: center;">
            hello, stranger <br>
            presenting you my generational meme collection <br>
            ¯\_(ツ)_/¯
        </p>
        <div class="slang-container">
            <div class="slang-grid" id="slangGrid">
                <!-- Content via JS -->
            </div>
        </div>
    </div>
    
    <script>
        let imagesList = [];
        const overlay = document.getElementById('overlay');
        const overlayImg = document.getElementById('overlay-img');
        const fortuneBtn = document.getElementById('fortune-trigger');

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        // Close Overlay logic
        overlay.addEventListener('click', () => {
            overlay.style.display = 'none';
        });

        // Fortune Cookie logic
        fortuneBtn.addEventListener('click', () => {
            if (imagesList.length === 0) return;
            const randomImage = imagesList[Math.floor(Math.random() * imagesList.length)];
            overlayImg.src = `assets/${randomImage}`;
            overlay.style.display = 'flex';
        });

        function loadImages() {
            const grid = document.getElementById('slangGrid');
            
            function getColumns() {
                const width = window.innerWidth;
                if (width <= 768) return 2;
                if (width <= 1200) return 4;
                return 7;
            }

            function distributeImages() {
                const columns = getColumns();
                grid.innerHTML = '';
                
                for (let i = 0; i < columns; i++) {
                    const column = document.createElement('div');
                    column.className = 'slang-column';
                    grid.appendChild(column);
                }

                const columnElements = grid.querySelectorAll('.slang-column');
                
                imagesList.forEach((file, index) => {
                    const columnIndex = index % columns;
                    const wrapper = document.createElement('div');
                    wrapper.className = 'img-wrapper';

                    const img = document.createElement('img');
                    img.className = 'slang-item';
                    img.src = `assets/${file}`;
                    img.loading = 'lazy'; 
                    img.alt = file;

                    const copyMsg = document.createElement('div');
                    copyMsg.className = 'copy-overlay';
                    copyMsg.textContent = 'copied!';
                    
                    // Click to Copy Logic
                    wrapper.addEventListener('click', (e) => {
                        const cvs = document.createElement('canvas');
                        cvs.width = img.naturalWidth;
                        cvs.height = img.naturalHeight;
                        const ctx = cvs.getContext('2d');
                        ctx.drawImage(img, 0, 0);
                        
                        cvs.toBlob(async (blob) => {
                            try {
                                const item = new ClipboardItem({ 'image/png': blob });
                                await navigator.clipboard.write([item]);
                                copyMsg.classList.add('show');
                                setTimeout(() => copyMsg.classList.remove('show'), 1000);
                            } catch (err) {
                                console.error('Clipboard error:', err);
                            }
                        }, 'image/png');
                    });
                    
                    wrapper.appendChild(img);
                    wrapper.appendChild(copyMsg);
                    columnElements[columnIndex].appendChild(wrapper);
                });
            }

            fetch('images.json')
                .then(response => response.json())
                .then(files => {
                    shuffleArray(files);
                    imagesList = files;
                    distributeImages(); 
                })
                .catch(err => console.error(err));

            let resizeTimeout;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimeout);
                resizeTimeout = setTimeout(distributeImages, 250);
            });
        }

        document.addEventListener('DOMContentLoaded', loadImages);
    </script>
</body>
</html>
