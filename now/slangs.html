        }

            display: flex;
            flex-direction: column;

            gap: 8px;

            margin: 0;
            line-height: 1.6;

        function normalizeSlang(text) {
            return text.toLowerCase().replace(/\s+/g, ' ').trim();
        }

        const overlay = document.getElementById('overlay');
        const fortuneText = document.getElementById('fortune-text');
        const fortuneBtn = document.getElementById('fortune-trigger');
        let currentFortuneIndex = 0;

        function openFortune(index) {
            if (!allSlangs.length) return;
            currentFortuneIndex = index;
            fortuneText.textContent = allSlangs[currentFortuneIndex];
            overlay.style.display = 'flex';
        }

        function closeFortune() {
            overlay.style.display = 'none';
        }

        function navigateFortune(dir) {
            if (overlay.style.display !== 'flex' || !allSlangs.length) return;
            currentFortuneIndex = (currentFortuneIndex + dir + allSlangs.length) % allSlangs.length;
            fortuneText.textContent = allSlangs[currentFortuneIndex];
        }

        async function copySlangText(text, el) {
            try {
                await navigator.clipboard.writeText(text);
                const originalText = el.textContent;
                el.textContent = 'copied!';
                setTimeout(() => { el.textContent = originalText; }, 200);
            } catch (err) {
                console.error('Failed to copy:', err);
            }
        }

        fortuneText.addEventListener('click', async (e) => {
            e.stopPropagation();
            await copySlangText(allSlangs[currentFortuneIndex], fortuneText);
        });

        overlay.addEventListener('click', closeFortune);

        function openRandomFortune() {
            if (!allSlangs.length) return;
            openFortune(Math.floor(Math.random() * allSlangs.length));
        }

        bindFortuneOpen({
            trigger: fortuneBtn,
            openRandom: openRandomFortune,
            isOpen: () => overlay.style.display === 'flex'
        });

        window.addEventListener('keydown', e => {
            if (e.key === 'Escape' && overlay.style.display === 'flex') closeFortune();
            if (e.key === 'ArrowRight') navigateFortune(1);
            if (e.key === 'ArrowLeft') navigateFortune(-1);
        });

        function loadSlangs() {
            const grid = document.getElementById('slangGrid');
            
            // Calculate number of columns based on viewport width
            function getColumns() {
                const width = window.innerWidth;
                if (width <= 600) return 1;
                if (width <= 900) return 2;
                return 3;
            }

            function distributeSlangs() {
                const columns = getColumns();
                grid.innerHTML = '';
                
                // Create column containers
                for (let i = 0; i < columns; i++) {
                    const column = document.createElement('div');
                    column.className = 'slang-column';
                    grid.appendChild(column);
                }

                // Distribute slangs across columns
                const columnElements = grid.querySelectorAll('.slang-column');
                allSlangs.forEach((slang, index) => {
                    const columnIndex = index % columns;
                    const slangItem = document.createElement('div');
                    slangItem.className = 'slang-item';
                    slangItem.textContent = slang;
                    
                    // Add click handler to copy to clipboard
                    slangItem.addEventListener('click', () => copySlangText(slang, slangItem));
                    
                    columnElements[columnIndex].appendChild(slangItem);
                });
            }

            // Initial load
            distributeSlangs();

            async function fetchDynamicSlangs() {
                try {
                    const res = await fetch(`${SHEET_API}?action=read&path=Dynamic`);
                    const json = await res.json();
                    const rows = json.data || [];
                    if (!Array.isArray(rows)) return;

                    const existing = new Set(allSlangs.map(normalizeSlang));
                    let added = false;

                    for (const row of rows) {
                        const text = (row.text || row.slangs || '').trim();
                        if (!text) continue;
                        const key = normalizeSlang(text);
                        if (existing.has(key)) continue;
                        existing.add(key);
                        allSlangs.push(text);
                        added = true;
                    }

                    if (added) distributeSlangs();
                } catch (err) {
                    console.error('Failed to fetch dynamic slangs:', err);
                }
            }

            fetchDynamicSlangs();

            // Redistribute on window resize with debouncing
            let resizeTimeout;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimeout);
                resizeTimeout = setTimeout(distributeSlangs, 250);
            });
        }

        // Load slangs when DOM is ready
        document.addEventListener('DOMContentLoaded', loadSlangs);
